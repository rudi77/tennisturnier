name: CI

# Railway liefert MATCHDAY aus und wartet dabei auf diese Pipeline: Ist sie
# rot, unterbleibt der Deploy (ADR-0018). Es gibt nur noch einen Baum, also
# nur noch einen Durchlauf — und der prüft jeden Push vollständig.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Ein zweiter Push auf denselben Branch macht den laufenden Durchgang
# gegenstandslos — er darf abgebrochen werden, statt die Warteschlange zu füllen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matchday:
    name: MATCHDAY
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matchday

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: matchday/web/package-lock.json

      - name: Oberfläche
        working-directory: matchday/web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - name: Bauen und testen
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release
          dotnet test --no-build --configuration Release

      # Läuft die Testprojekte noch einmal, diesmal mit Messung: eine offene
      # Zeile oder ein ungenommener Ausgang macht den Durchlauf rot.
      - name: Abdeckung
        shell: pwsh
        run: ./scripts/coverage.ps1

      - name: Berichte ablegen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matchday-berichte
          path: matchday/TestResults
          if-no-files-found: warn
